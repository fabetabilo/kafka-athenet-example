services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # kafka:29092 para contenedores, localhost:9092 para el host
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # los topics se crean desde el codigo, no al publicar
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # revisar la retencion cada 30 s (por defecto 5 min) para verla en la fase 8
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      # con acks=all, una escritura necesita al menos 2 replicas al dia
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 10s
      retries: 10

  # brokers 2 y 3: misma configuracion, otro id y otro puerto externo
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-2:29092,EXTERNO://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9093 --list
      interval: 10s
      retries: 10

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-3:29092,EXTERNO://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9094 --list
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
      - kafka-2
      - kafka-3
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: athenet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka-2:29092,kafka-3:29092

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: competitions
      POSTGRES_USER: athenet
      POSTGRES_PASSWORD: athenet
    volumes:
      # crea la tabla y los partidos programados solo con la base vacia
      - ./ms-competitions/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U athenet -d competitions
      interval: 5s
      retries: 10

  ms-competitions:
    build: ./ms-competitions
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/competitions
      # si un broker cae, el cliente arranca con cualquiera de los otros
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-2:29092,kafka-3:29092

  web-org:
    build: ./web-org
    depends_on:
      - ms-competitions
    ports:
      - "5000:5000"

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-datos:/data/db

  mongo-express:
    image: mongo-express
    depends_on:
      - mongo
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

  ms-statistics:
    build: ./ms-statistics
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      mongo:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/statistics
      # si un broker cae, el cliente arranca con cualquiera de los otros
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-2:29092,kafka-3:29092
      # probar con 1, 3 y 4
      ESTADISTICAS_HILOS: 1

  web-public:
    build: ./web-public
    depends_on:
      - ms-statistics
    ports:
      - "5173:80"

volumes:
  postgres-datos:
  mongo-datos:
